name: Build and Push Docker Image

# Push a tag to release:  git tag v1.2.0 && git push origin v1.2.0
# (build-* tags still work for one-off builds: git tag build-test-1 && git push origin build-test-1)
on:
  push:
    tags:
      - 'v*'
      - 'build-*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gheith3/enjaz

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The image is only built from a commit whose tests pass (SQLite + PostgreSQL + Pint).
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, latest; build-foo -> build-foo; always the short commit sha.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: redeploys a Portainer stack. Skipped when the PORTAINER_WEBHOOK_URL secret
  # is not set (e.g. an air-gapped server that GitHub cannot reach).
  trigger-portainer:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "PORTAINER_WEBHOOK_URL is not set; skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
