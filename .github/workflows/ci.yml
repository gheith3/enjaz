# Checks every push and pull request: code style, tests, front-end build.
# Same checks as "Before committing" in CLAUDE.md, so main never gets code that only passed on one machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by build-and-push.yml: an image is only built from a commit whose checks pass.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Tests run on PostgreSQL like production (jsonb, ilike, ordering differ from SQLite).
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: injazat_test
          POSTGRES_USER: injazat_user
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U injazat_user -d injazat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: injazat_user
      DB_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pcntl, mbstring, pdo_sqlite, pdo_pgsql, redis, bcmath, gd, exif
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Build front-end
        run: |
          npm ci
          npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --parallel --compact
