# Checks every push and pull request: code style, tests, front-end build.
# Same checks as "Before committing" in CLAUDE.md, so main never gets code that only passed on one machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, zip, pcntl, mbstring, pdo_sqlite, pdo_pgsql, redis, bcmath, gd, exif
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Build front-end
        run: |
          npm ci
          npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
