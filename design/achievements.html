    <nav class="site-nav flex flex-col gap-[3rem] text-right">

      <a href="contact.html" class="!text-[3rem]">تواصل معنا</a>

  <h1 class="relative lg:absolute lg:top-[17.4rem] inset-x-0 m-0 text-center text-white text-[6.7rem] leading-[9.4rem] font-normal">الإنجازات</h1>
  <form class="search-box relative mx-auto mt-[3rem] lg:mt-0 lg:absolute lg:top-[28.9rem] lg:right-[64.6rem] max-lg:w-[calc(100%-8rem)]" role="search" onsubmit="return false">

  </form>

<!-- ===== Filters + cards ===== -->
<main class="relative px-[4rem] lg:px-0 pb-[11.5rem]" x-data="{
    cats: [
      {name:'الكل'}, {name:'الرياضة', icon:'sports'}, {name:'الثقافة', icon:'culture'},
      {name:'العلوم', icon:'science'}, {name:'العسكرية', icon:'military'}, {name:'الطبي', icon:'medical'}
    ],
    active: 'الرياضة',
    cards: [
      {img:'ach-inventor',   title:'ذهبية معرض ماليزيا للاختراعات', tags:['الرياضة','كرة القدم']},
      {img:'ach-itex',       title:'جائزة الأدب العربي',            tags:['الرياضة','كرة القدم']},
      {img:'ach-red-award',  title:'جائزة الأدب العربي',            tags:['الثقافة','الأدب']},
      {img:'ach-red-award',  title:'جائزة الأدب العربي',            tags:['الثقافة','الأدب']},
      {img:'ach-booker',     title:'تكريم مجلس التعاون',            tags:['الثقافة','الأدب']},
      {img:'ach-basketball', title:'بطولة كرة السلة',               tags:['الرياضة','كرة القدم']}
    ]
  }">
  <img src="assets/images/brand/logo-white.png" alt="" aria-hidden="true" class="hidden lg:block absolute left-[34.6rem] top-[0.8rem] w-[77rem] brightness-0 opacity-[0.035] pointer-events-none">
  <div class="relative pt-[7.7rem] flex flex-wrap gap-[2rem] lg:block">
    <div class="flex flex-wrap gap-[2rem] lg:grid lg:grid-cols-[repeat(6,16.8rem)] lg:gap-x-[2.75rem] lg:mr-[62.8rem] lg:w-[114.55rem]">
      <template x-for="c in cats" :key="c.name">
        <button type="button" class="filter-pill" :class="active === c.name && 'is-active'" @click="active = c.name">
          <template x-if="c.icon"><img :src="'assets/images/icons/cat/' + c.icon + '.svg'" alt=""></template>
          <span x-text="c.name"></span>
        </button>
      </template>
    </div>
    <button type="button" class="filter-pill lg:absolute lg:top-[7.7rem] lg:right-[15.5rem] gap-[2.8rem]">
      <span class="flex flex-col gap-[0.5rem]"><i class="block w-[2.2rem] h-[0.3rem] rounded bg-[#5c5c5c]"></i><i class="block w-[2.2rem] h-[0.3rem] rounded bg-[#5c5c5c]"></i><i class="block w-[2.2rem] h-[0.3rem] rounded bg-[#5c5c5c]"></i></span>
      <span>تصفية</span>
    </button>
  </div>

  <div class="mt-[5.9rem] grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[repeat(3,50.9rem)] gap-[5.7rem] lg:mr-[13.9rem]">
    <template x-for="(c, i) in cards" :key="i">
      <article class="ach-card">
        <img class="media" :src="'assets/images/photos/' + c.img + '.jpg'" :alt="c.title">
        <div class="tags"><template x-for="t in c.tags" :key="t"><span class="tag" x-text="t"></span></template></div>
        <p class="date">23 May 2023</p>
        <h3 class="title" x-text="c.title"></h3>
        <p class="desc">حصل مشروع «إزالة الفينول باستخدام كربون نشط مصنع من مخلفات طبيعية » من جامعة السلطان قابوس على إنجازين مشرفين على المستوى الإقليمي والدولي جاء كالآتي: الميدالية الفضية …</p>
        <a class="read" href="achievement-detail.html">اقرأ المزيد</a>
      </article>
    </template>
  </div>
</main>

    <li class="flex items-center gap-[2.2rem]"><img src="assets/images/icons/phone.svg" alt="" class="w-[1.9rem]"><span dir="ltr">+968 93322212</span></li>
