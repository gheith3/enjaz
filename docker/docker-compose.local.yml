services:
  # MariaDB Database
  database:
    image: postgres:16
    container_name: enjaz-db
    environment:
      POSTGRES_DB: enjaz
      POSTGRES_USER: enjaz_user
      POSTGRES_PASSWORD: enjaz_secret
    ports:
      - "5992:5432"
    volumes:
      - enjaz_postgres_data:/var/lib/postgresql/data
    networks:
      - enjaz-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: enjaz-redis
    ports:
      - "5993:6379"
    volumes:
      - enjaz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enjaz-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: enjaz-s3
    restart: always
    ports:
      - "5994:9001"
      - "5995:9000"
    environment:
      RUSTFS_ACCESS_KEY: 0Fcn8zl2ge5T
      RUSTFS_SECRET_KEY: dytge5-niMcik-gyvxir
    volumes:
      - enjaz_rustfs_data:/data
    command: >
      /data
      --address :9000
      --console-enable
      --console-address :9001
      --access-key 0Fcn8zl2ge5T
      --secret-key dytge5-niMcik-gyvxir
      --server-domains enjaz.test
    networks:
      - enjaz-network

volumes:
  enjaz_postgres_data:
  enjaz_redis_data:
  enjaz_rustfs_data:

networks:
  enjaz-network:
    driver: bridge
